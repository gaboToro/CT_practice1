<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi App</title>
</head>
<body>
    <h2>Crear Cuenta</h2>
    <form id="registerForm">
        <input type="email" id="email" placeholder="Correo electrónico" required><br><br>
        <input type="password" id="password" placeholder="Contraseña" required><br><br>
        <button type="submit">Registrarme</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>

    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            if (res.ok) {
                alert("Registro exitoso. Ahora puedes iniciar sesión.");
                window.location.href = "index.html";
            } else {
                const data = await res.json();
                alert("Error: " + data.message);
            }
        };
    </script>
</body>
</html>
